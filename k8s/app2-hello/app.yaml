apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1-hello
  template:
    metadata:
      labels:
        app: app1-hello
    spec:
      containers:
      - name: app1-hello
        image: sarangasl/hello-node:latest
        env:
        - name: ENV_VALUE
          value: "Hello from app.yaml"
        - name: DB_PASSWORD
          value: "CGHANMm4Q="
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: app1-hello
spec:
  selector:
    app: app1-hello
  type: LoadBalancer
  ports:
     - protocol: TCP
       port: 80
       targetPort: 3000