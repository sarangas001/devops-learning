name: Demo CI Env Secrets

on:
  workflow_dispatch

jobs:
    build:
        runs-on: ubuntu-latest
    
        steps:
            - name: Say Hello
              run: echo "Hello from the terminal second workflow!"

            - name: Install
              env:
                APP_ENV: demo_new
                DB_PASSWORD: ${{ secrets.DB_PASSWORD}}
              run: echo "Environment $DB_PASSWORD is being used for installation in $APP_ENV environment"