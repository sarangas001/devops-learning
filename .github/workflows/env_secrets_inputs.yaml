name: Demo CI Env Secrets

on:
  workflow_dispatch

env:
    GLOBAL_APP_ENV: GLOBAL_DEMO

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            JOB_APP_ENV: job_dev
    
        steps:
            - name: Say Hello
              run: echo "Hello from the terminal second workflow!"

            - name: Install
              env:
                APP_ENV: demo_new
                DB_PASSWORD: ${{ secrets.DB_PASSWORD}}
              run: echo "Environment $DB_PASSWORD is being used for installation in $APP_ENV environment, global env is $GLOBAL_APP_ENV and job env is $JOB_APP_ENV"
            
            - name: Install
              run: |
                   echo "Hello from CI Pipeline" > demo.txt
                   echo "File created successfully!"

            - name: Upload Demo
              uses: actions/upload-artifact@v7
              with:
                name: build-artifacts-demo
                path: .