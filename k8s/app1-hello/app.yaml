apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1-hello
  template:
    metadata:
      labels:
        app: app1-hello
    spec:
      containers:
      - name: app1-hello
        image: sarangasl/hello-spring:latest
        # env:
        # - name: APP_MESSAGE
        #   value: "hELLO FROM APP.YAML"
        # - name: DB_PASSWORD
        #   value: "CGHANMm4Q="
        env:
        - name: ENV_VALUE
          value: "Hello from app.yaml"
        - name: DB_PASSWORD
          value: "CGHANMm4Q="
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app1-hello
spec:
  selector:
    app: app1-hello
  type: ClusterIP
  ports:
    -  port: 80
       targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1-hello-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1-hello
            port:
              number: 80