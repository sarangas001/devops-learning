apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1-hello
  template:
    metadata:
      labels:
        app: app1-hello
    spec:
      containers:
      - name: app1-hello
        image: embarkx/hello-node:latest
        env:
        # - name: ENV_VALUE
        #   value: "Hello from app.yaml!"
        # - name: DB_PASSWORD
        #   value: "CGHANMm4Q="
        env:
        - name: ENV_VALUE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ENV_VALUE
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hello-db-secret
              key: HELLO_DB_PASSWORD
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: app1-hello
spec:
  selector:
    app: app1-hello
  type: NodePort
  ports:
    -  port: 3000
       targetPort: 3000
       nodePort: 32000